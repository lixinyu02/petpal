<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f6f7f2" />
    <script>
      /* Keep this first-paint policy in sync with src/platform/theme.mjs. */
      (() => {
        let preference = 'day';
        const query = new URLSearchParams(location.search), transparent = query.has('pet') || query.has('overlay');
        const valid = value => value === 'day' || value === 'night' || value === 'auto';
        let saved = null, seed = null, sameSession = false;
        try { saved = localStorage.getItem('petpal.theme'); if (valid(saved)) preference = saved; } catch {}
        try { seed = !transparent && globalThis.window?.petpal?.appearance?.initial; if (!seed || !valid(seed.preference) || seed.saved !== true) seed = null; } catch {}
        if (seed) {
          try { sameSession = !!seed.sessionId && localStorage.getItem('petpal.theme.native-session') === seed.sessionId; } catch {}
          if (!valid(saved) || seed.sessionId && !sameSession) preference = seed.preference;
          try { localStorage.setItem('petpal.theme', preference); if (seed.sessionId) localStorage.setItem('petpal.theme.native-session', seed.sessionId); } catch {}
        }
        const hour = new Date().getHours(), theme = preference === 'auto' ? (hour >= 7 && hour < 19 ? 'day' : 'night') : preference;
        const root = document.documentElement;
        root.dataset.theme = theme; root.dataset.themePreference = preference;
        if (transparent) root.dataset.petpalSurface = 'transparent';
        root.style.colorScheme = theme === 'night' ? 'dark' : 'light';
        root.style.backgroundColor = transparent ? 'transparent' : theme === 'night' ? '#282828' : '#fafbf8';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'night' ? '#282828' : '#f6f7f2');
      })();
    </script>
    <meta name="description" content="小伴 PetPal，你的二次元伙伴与个人 AI 助手。" />
    <title>小伴 PetPal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
