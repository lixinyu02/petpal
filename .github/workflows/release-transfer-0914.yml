name: Verified PetPal 0.9.14 byte transfer
on:
  push:
    branches: [release-transfer-v0.9.14]
permissions:
  contents: read
concurrency:
  group: petpal-release-transfer-v0.9.14
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'lixinyu02/petpal' && github.ref == 'refs/heads/release-transfer-v0.9.14'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          check-latest: false
      - name: Transfer six frozen packages and verify ten complete assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release-transfer-0914/run.mjs
